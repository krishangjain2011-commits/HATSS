# Render.com Native Build Configuration (No Docker)
# This configuration uses Render's native runtimes instead of Docker

services:
  # Frontend - Static Site
  - type: static_site
    name: hatss-frontend
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    publishDirectory: frontend/dist
    envVars:
      - key: NODE_ENV
        value: production

  # Backend - Web Service  
  - type: web
    name: hatss-backend
    runtime: python
    pythonVersion: 3.11
    buildCommand: pip install -e backend && pip install gunicorn
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app
    workingDirectory: backend
    envVars:
      - key: HATSS_ENVIRONMENT
        value: production
      - key: HATSS_DEBUG
        value: "false"
      - key: HATSS_DOCS_ENABLED
        value: "false"
