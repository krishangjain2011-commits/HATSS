services:
  # Frontend Service - Static Site (No Docker needed)
  - type: static_site
    name: hatss-frontend
    buildCommand: cd frontend && npm install && npm run build
    publishDirectory: frontend/dist
    envVars:
      - key: NODE_ENV
        value: production

  # Backend Service - Web Service (No Docker needed)
  - type: web
    name: hatss-backend
    runtime: python
    pythonVersion: 3.11
    buildCommand: cd backend && pip install -e . && pip install gunicorn
    startCommand: cd backend && gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app
    envVars:
      - key: HATSS_ENVIRONMENT
        value: production
      - key: HATSS_DEBUG
        value: "false"
      - key: HATSS_DOCS_ENABLED
        value: "false"

